name: deploy

# O pipeline faz o que você fez à mão na atividade 2. A cada push na main, ele
# derruba a topologia e sobe de novo, do zero.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SLUG: rian-freires
  PORTA: 23290

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a chave de deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: Derrubar a topologia antiga
        run: |
          # 1. Para os containers caso estejam rodando
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker stop front || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker stop api || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker stop banco || true

          # 2. Remove os containers (sem -f para respeitar o wrapper)
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker rm front || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker rm api || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker rm banco || true

      - name: Criar rede e volume
        run: |
          # Cria o volume e as duas redes se não existirem
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker volume create pgdata || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker network create dados --interna || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker network create web || true

      - name: Subir banco, API e front
        run: |
          # 1. Banco (rede interna, volume pgdata montado)
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker run -d \
            --name banco \
            --network dados \
            -v pgdata:/var/lib/postgresql/data \
            -e POSTGRES_DB=pokedex \
            -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} \
            postgres:17-alpine

          # 2. API (rede dados + conectada à web)
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker run -d \
            --name api \
            --network dados \
            -e POSTGRES_HOST=gr-${{ env.SLUG }}-banco \
            -e POSTGRES_DB=pokedex \
            -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} \
            gr-atv2-api:1

          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker network connect web api

          # 3. Front (rede web, porta publicada e commit SHA)
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker run -d \
            --name front \
            --network web \
            -p ${{ env.PORTA }}:80 \
            -e API=gr-${{ env.SLUG }}-api \
            -e DEPLOY_SHA=${{ github.sha }} \
            gr-atv2-front:1

      - name: Conferir que subiu
        run: |
          sleep 10
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://gr.lab.ayty.org:${{ env.PORTA }}